worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  autoindex off;

  log_format safe '$remote_addr - $request_method $uri $status $body_bytes_sent '
                  '"$http_user_agent"';
  access_log /dev/stdout safe;

  client_max_body_size 157286400;
  client_body_timeout 120s;
  send_timeout 120s;
  keepalive_timeout 30s;

  proxy_connect_timeout 5s;
  proxy_send_timeout 120s;
  proxy_read_timeout 120s;
  proxy_request_buffering off;
  proxy_buffering off;

  upstream mafusheets_app {
    server 172.30.0.10:3000;
    keepalive 16;
  }

  server {
    listen 8080 default_server;
    server_name _;
    return 308 https://$host$request_uri;
  }

  server {
    listen 8443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    include /etc/nginx/security-headers.conf;

    location = /ready {
      return 404;
    }

    location ~* (^|/)\.(?!well-known/) {
      return 404;
    }

    location ~* \.(?:sqlite(?:3)?|db|bak|backup|env|map)(?:[-.].*)?$ {
      return 404;
    }

    location ~* ^/(?:data|uploads|staging|quarantine|internal)(?:/|$) {
      return 404;
    }

    location / {
      proxy_pass http://mafusheets_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Connection "";
      proxy_hide_header Server;
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "private, no-store" always;
    }

    location ~* ^/(?:assets/|favicon\.ico$) {
      proxy_pass http://mafusheets_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Connection "";
      include /etc/nginx/security-headers.conf;
      expires 1h;
      add_header Cache-Control "public, max-age=3600" always;
    }

    location ~* ^/thumbnails/ {
      proxy_pass http://mafusheets_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Connection "";
      proxy_hide_header Cache-Control;
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "private, max-age=300" always;
    }
  }
}
