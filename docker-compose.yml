services:
  mafusheets:
    build: .
    container_name: mafusheets
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-3000}
      PDFTOPPM_BIN: ${PDFTOPPM_BIN:-pdftoppm}
      DATABASE_PATH: ${DATABASE_PATH:-/app/data/mafusheets.sqlite}
      DELETE_CODE: ${DELETE_CODE:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./.tmp:/app/.tmp
    restart: unless-stopped
