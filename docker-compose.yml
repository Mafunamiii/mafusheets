services:
  mafusheets:
    build: .
    container_name: mafusheets
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-3000}
      PDFTOPPM_BIN: ${PDFTOPPM_BIN:-pdftoppm}
      PDFINFO_BIN: ${PDFINFO_BIN:-pdfinfo}
      DATABASE_PATH: ${DATABASE_PATH:-/app/data/mafusheets.sqlite}
      SESSION_SECRET: ${SESSION_SECRET:?Set a strong persistent SESSION_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      UPLOAD_MAX_FILE_BYTES: ${UPLOAD_MAX_FILE_BYTES:-52428800}
      UPLOAD_MAX_REQUEST_BYTES: ${UPLOAD_MAX_REQUEST_BYTES:-157286400}
      UPLOAD_MAX_FILES: ${UPLOAD_MAX_FILES:-10}
      UPLOAD_USER_STORAGE_BYTES: ${UPLOAD_USER_STORAGE_BYTES:-2147483648}
      UPLOAD_USER_DAILY_BYTES: ${UPLOAD_USER_DAILY_BYTES:-524288000}
      UPLOAD_USER_CONCURRENCY: ${UPLOAD_USER_CONCURRENCY:-1}
      UPLOAD_WORKER_CONCURRENCY: ${UPLOAD_WORKER_CONCURRENCY:-2}
      UPLOAD_PROCESS_TIMEOUT_MS: ${UPLOAD_PROCESS_TIMEOUT_MS:-30000}
      UPLOAD_REQUEST_TIMEOUT_MS: ${UPLOAD_REQUEST_TIMEOUT_MS:-120000}
      UPLOAD_MAX_PDF_PAGES: ${UPLOAD_MAX_PDF_PAGES:-500}
      UPLOAD_MAX_IMAGE_PIXELS: ${UPLOAD_MAX_IMAGE_PIXELS:-40000000}
      UPLOAD_STAGING_MAX_AGE_MS: ${UPLOAD_STAGING_MAX_AGE_MS:-86400000}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./.tmp:/app/.tmp
    restart: unless-stopped
