# Installed by install-backup-ssh-hardening.sh. Never reload before `sshd -t`.
Match User mafusheets-backup
    AuthorizedKeysFile /etc/ssh/authorized_keys/%u
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PubkeyAuthentication yes
    AuthenticationMethods publickey
    AllowAgentForwarding no
    AllowTcpForwarding no
    X11Forwarding no
    PermitTunnel no
    PermitTTY no
    GatewayPorts no
    PermitUserEnvironment no

# End the conditional block so later included/global directives retain their intended scope.
Match all
